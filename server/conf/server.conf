# ============================================================================
# SmartHome Server 配置（角色 A 负责）
#
# 默认从项目根目录启动：./build/server/smart_home_server
# 也可用命令行参数指定其它配置：./build/server/smart_home_server /tmp/test.conf
#
# ============================================================================

# 监听地址（0.0.0.0 表示所有网卡）
ip 127.0.0.1

# 监听端口
port 7777

# 线程池线程数
thread_num 4

# 任务队列容量
task_num 10000

# 录像文件保存目录（相对项目根目录）
video_path ./data/

# 日志文件路径（相对项目根目录）
log_file ./log/server.log

# 登录会话超时（秒）：登录态超过该时长未重新登录会自动失效，需重新登录
session_timeout 1800

# ------------------------- MySQL 数据库配置 -------------------------

# MySQL 服务器地址
mysql_host 0.0.0.0

# MySQL 端口
mysql_port 3306

# MySQL 用户名
mysql_user smarthome

# MySQL 密码
mysql_password 1234

# 数据库名
mysql_database smarthome

# ------------------------- 摄像头 HTTP 接口 -------------------------

# 云台控制 token 签名密钥（迅思维默认 secret，按本地环境可覆盖）
camera_secret f6fdffe48c908deb0f4c3bd36c032e72

# 云台允许访问的摄像头 IPv4 白名单（多个地址逗号分隔）。
# 生产/联调时请只在服务器本地配置文件中填写实际地址，不要把内网地址提交到仓库。
# ptz_allowed_hosts <camera-ip-1>,<camera-ip-2>
